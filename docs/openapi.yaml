openapi: 3.0.3
info:
  title: Uniblox Checkout Rewards Service API
  version: 0.1.0
  description: |
    Ecommerce checkout service with transaction-safe inventory, idempotent checkout,
    administrator-triggered milestone coupons, and read-only reporting. Administrative
    endpoints are deliberately unauthenticated in this take-home; production requires authorization.
servers:
  - url: http://localhost:8080
paths:
  /products:
    get:
      summary: List products and their current prices and stock
      responses:
        '200':
          description: Product catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }
        '500': { $ref: '#/components/responses/InternalError' }
  /products/{productId}:
    get:
      summary: Get one product
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200': { description: Product, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '404': { $ref: '#/components/responses/ProductNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /carts:
    post:
      summary: Create an empty cart
      responses:
        '201': { description: Cart created, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '500': { $ref: '#/components/responses/InternalError' }
  /carts/{cartId}:
    get:
      summary: Get a cart using current product prices
      parameters:
        - $ref: '#/components/parameters/CartId'
      responses:
        '200': { description: Cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '404': { $ref: '#/components/responses/CartNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /carts/{cartId}/items:
    post:
      summary: Add a product to a cart, merging quantity with an existing line
      parameters:
        - $ref: '#/components/parameters/CartId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCartItemRequest' }
      responses:
        '200': { description: Updated cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/ProductOrCartNotFound' }
        '409': { $ref: '#/components/responses/CartOrStockConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /carts/{cartId}/items/{productId}:
    put:
      summary: Set an item's absolute quantity
      parameters:
        - $ref: '#/components/parameters/CartId'
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetCartItemQuantityRequest' }
      responses:
        '200': { description: Updated cart, content: { application/json: { schema: { $ref: '#/components/schemas/Cart' } } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/ProductOrCartNotFound' }
        '409': { $ref: '#/components/responses/CartOrStockConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      summary: Remove a product from a cart
      parameters:
        - $ref: '#/components/parameters/CartId'
        - $ref: '#/components/parameters/ProductId'
      responses:
        '204': { description: Item removed }
        '404': { $ref: '#/components/responses/ProductOrCartNotFound' }
        '409': { $ref: '#/components/responses/CartAlreadyCheckedOut' }
        '500': { $ref: '#/components/responses/InternalError' }
  /carts/{cartId}/checkout:
    post:
      summary: Check out a cart. Payment success is simulated by a successful transaction.
      parameters:
        - $ref: '#/components/parameters/CartId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '201': { description: New order created, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '200':
          description: Idempotent replay of the original successful order
          headers:
            Idempotent-Replayed: { schema: { type: boolean, example: true } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404': { $ref: '#/components/responses/ProductOrCartNotFound' }
        '409': { $ref: '#/components/responses/CheckoutConflict' }
        '422': { $ref: '#/components/responses/CheckoutUnprocessable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /orders/{orderId}:
    get:
      summary: Get the immutable order snapshot
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /admin/coupons/generate:
    post:
      summary: Generate one coupon for the lowest eligible unrewarded milestone
      description: Administrative and intentionally unauthenticated for this take-home.
      responses:
        '201': { description: Coupon generated, content: { application/json: { schema: { $ref: '#/components/schemas/Coupon' } } } }
        '409':
          description: NO_ELIGIBLE_MILESTONE or RETRYABLE_CONFLICT. Retry-After is present only for RETRYABLE_CONFLICT.
          headers:
            Retry-After:
              description: Present only when code is RETRYABLE_CONFLICT.
              schema: { type: integer, minimum: 1 }
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '500': { $ref: '#/components/responses/InternalError' }
  /admin/report:
    get:
      summary: Return a non-mutating consistent revenue, coupon, and purchase report
      description: |
        Administrative and intentionally unauthenticated for this take-home. All fields are returned
        by one SQL statement so aggregates share one database statement snapshot. H2 PostgreSQL mode
        is not proof of PostgreSQL isolation or locking equivalence.
      responses:
        '200': { description: Report, content: { application/json: { schema: { $ref: '#/components/schemas/Report' } } } }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  parameters:
    CartId:
      name: cartId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]{1,128}$'
  responses:
    ValidationFailed:
      description: VALIDATION_FAILED
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ProductNotFound:
      description: PRODUCT_NOT_FOUND
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    CartNotFound:
      description: CART_NOT_FOUND
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    OrderNotFound:
      description: ORDER_NOT_FOUND
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ProductOrCartNotFound:
      description: PRODUCT_NOT_FOUND or CART_NOT_FOUND
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    CartAlreadyCheckedOut:
      description: CART_ALREADY_CHECKED_OUT
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    CartOrStockConflict:
      description: CART_ALREADY_CHECKED_OUT or INSUFFICIENT_STOCK
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    CheckoutConflict:
      description: INSUFFICIENT_STOCK, CART_ALREADY_CHECKED_OUT, PRICE_CHANGED, COUPON_ALREADY_REDEEMED, or RETRYABLE_CONFLICT.
      headers: { Retry-After: { schema: { type: integer, minimum: 1 }, description: Present only for RETRYABLE_CONFLICT } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    CheckoutUnprocessable:
      description: EMPTY_CART, COUPON_NOT_FOUND, or IDEMPOTENCY_KEY_REUSED.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    InternalError:
      description: INTERNAL_ERROR. Unexpected failures are returned without database or stack details.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Money:
      type: string
      pattern: '^\d+\.\d{2}$'
      example: '18.50'
      description: Non-negative USD amount, normalized to two decimal places with HALF_UP rounding. Inputs with more than two decimal places are rejected.
    Percentage:
      type: string
      pattern: '^(100\.00|(?:[1-9]?\d)(?:\.\d{2})?)$'
      example: '10.00'
      description: Percentage from 0 through 100, serialized with two decimal places.
    Product:
      type: object
      required: [id, name, unitPrice, stock]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        unitPrice: { $ref: '#/components/schemas/Money' }
        stock: { type: integer, minimum: 0 }
    CartLine:
      type: object
      required: [productId, productName, quantity, unitPrice, lineTotal]
      properties:
        productId: { type: integer, format: int64 }
        productName: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { $ref: '#/components/schemas/Money' }
        lineTotal: { $ref: '#/components/schemas/Money' }
    Cart:
      type: object
      required: [id, status, items, subtotal]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [OPEN, CHECKED_OUT] }
        items: { type: array, items: { $ref: '#/components/schemas/CartLine' } }
        subtotal: { $ref: '#/components/schemas/Money' }
    AddCartItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: integer, format: int64, minimum: 1 }
        quantity: { type: integer, minimum: 1, maximum: 1000000 }
    SetCartItemQuantityRequest:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1, maximum: 1000000 }
    CheckoutRequest:
      type: object
      properties:
        couponCode: { type: string, minLength: 1, maxLength: 64, description: Normalized by trim and uppercase. A present blank value is invalid. }
        expectedTotal: { $ref: '#/components/schemas/Money', description: Optional final payable total after discount. }
    OrderLine:
      type: object
      required: [productId, productName, quantity, unitPrice, lineSubtotal]
      properties:
        productId: { type: integer, format: int64 }
        productName: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { $ref: '#/components/schemas/Money' }
        lineSubtotal: { $ref: '#/components/schemas/Money' }
    Order:
      type: object
      required: [id, cartId, status, lines, gross, discount, net, createdAt]
      properties:
        id: { type: string, format: uuid }
        cartId: { type: string, format: uuid }
        status: { type: string, enum: [PLACED] }
        lines: { type: array, items: { $ref: '#/components/schemas/OrderLine' } }
        gross: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        net: { $ref: '#/components/schemas/Money' }
        couponCode: { type: string, nullable: true }
        discountPercent:
          type: string
          nullable: true
          pattern: '^(100\.00|(?:[1-9]?\d)(?:\.\d{2})?)$'
        createdAt: { type: string, format: date-time }
    Coupon:
      type: object
      required: [code, milestone, discountPercent, status]
      properties:
        code: { type: string }
        milestone: { type: integer, minimum: 1 }
        discountPercent: { $ref: '#/components/schemas/Percentage' }
        status: { type: string, enum: [AVAILABLE, REDEEMED] }
        redeemedOrderId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
    PurchasedQuantity:
      type: object
      required: [productId, productName, purchasedQuantity]
      properties:
        productId: { type: integer, format: int64 }
        productName: { type: string }
        purchasedQuantity: { type: integer, minimum: 0 }
    Report:
      type: object
      required: [purchasedQuantityByProduct, gross, totalDiscounts, net, couponsGenerated, couponsAvailable, couponsRedeemed, totalOrders]
      properties:
        purchasedQuantityByProduct:
          type: array
          description: Every catalog product, including those with zero purchases, ordered by product ID.
          items: { $ref: '#/components/schemas/PurchasedQuantity' }
        gross: { $ref: '#/components/schemas/Money' }
        totalDiscounts: { $ref: '#/components/schemas/Money' }
        net: { $ref: '#/components/schemas/Money' }
        couponsGenerated: { type: integer, minimum: 0 }
        couponsAvailable: { type: integer, minimum: 0 }
        couponsRedeemed: { type: integer, minimum: 0 }
        totalOrders: { type: integer, minimum: 0 }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          enum: [VALIDATION_FAILED, PRODUCT_NOT_FOUND, CART_NOT_FOUND, ORDER_NOT_FOUND, INSUFFICIENT_STOCK, CART_ALREADY_CHECKED_OUT, EMPTY_CART, PRICE_CHANGED, COUPON_NOT_FOUND, COUPON_ALREADY_REDEEMED, IDEMPOTENCY_KEY_REUSED, NO_ELIGIBLE_MILESTONE, RETRYABLE_CONFLICT, INTERNAL_ERROR]
        fieldErrors: { type: object, additionalProperties: { type: string } }
