spring:
  application:
    name: uniblox-checkout-rewards-service
  datasource:
    url: jdbc:h2:mem:uniblox;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always

rewards:
  n: 5
  discount-percent: 10
  generation-max-attempts: 3
  code-max-attempts: 5

app:
  db:
    lock-timeout-ms: 5000
